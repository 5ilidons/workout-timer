name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME); no setup action needed.

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: |
          S=app/src/main/java/app/bagtimer/engine
          kotlinc -version 2>/dev/null || sudo snap install kotlin --classic
          kotlinc $S/Timeline.kt $S/Cues.kt app/src/test/java/app/bagtimer/engine/EngineTest.kt -include-runtime -d engine-test.jar
          java -cp engine-test.jar app.bagtimer.engine.EngineTestKt

      - name: Build release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk bag-timer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bag-timer-apk
          path: bag-timer.apk

      # One release per build; "latest" always points at the newest, so this link never changes:
      # https://github.com/<owner>/<repo>/releases/latest/download/bag-timer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bag Timer 1.0.${{ github.run_number }}
          body: Install bag-timer.apk on your phone or Fire TV. Each build installs over the last one.
          files: bag-timer.apk
          make_latest: true
